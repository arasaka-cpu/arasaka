# Arasaka A/B: use the busybox-style initramfs so the arasaka-ab hook can
# override the root mount handler (the systemd initramfs hook cannot run
# run_hook() mount_handler overrides). The arasaka-ab hook mounts the active
# A/B slot partition and handles rollback of failed slot swaps.
# plymouth removed from HOOKS: COSMIC desktop uses greetd (seatd), not
# plymouth.  plymouthd in initramfs holds DRM master and blocks the
# compositor from rendering → black screen on real hardware.
HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block arasaka-verity filesystems fsck arasaka-ab)
# The root slot is a squashfs image verified through dm-verity; overlayfs and
# btrfs are needed by the mount handler for the writable /var layer on /data.
# autodetect only keeps modules loaded on the build host, so pin them here.
# GPU drivers: nouveau (NVK/Turing+), i915 (Intel), amdgpu (AMD) — the kms
# hook only detects the build host's hardware, so we force common drivers
# to guarantee KMS on any real machine.
MODULES=(dm-mod dm-verity squashfs overlay btrfs nouveau i915 amdgpu)
# GSP firmware for nouveau on Turing and above. The kms hook only
# autodetects the build host's GPU, so CI would miss firmware for other
# GPUs. Include the whole GSP directory version-agnostically.
FILES=(/usr/lib/firmware/nvidia/tu116/gsp/* /usr/lib/firmware/nvidia/tu102/gsp/*)
