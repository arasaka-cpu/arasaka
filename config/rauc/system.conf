# Arasaka RAUC system configuration
#
# Installed to /etc/rauc/system.conf. Describes the A/B rootfs slots and the
# custom systemd-boot backend used for slot switching.
#
# The slots are RAW containers: each holds a squashfs image with an appended
# dm-verity hash tree (the same image the bundle ships, and the same shape the
# installers write on a fresh install). RAUC writes it to the slot partition
# verbatim - there is no filesystem to manage, resize or relabel. Slot identity
# is the GPT partition label (by-partlabel), which is set once by the
# partitioner and is stable regardless of slot content.
#
# The booted slot is detected explicitly via the `rauc.slot=<bootname>` kernel
# command line parameter (see the loader entries written by install-to-disk.sh
# and the RAUC set-primary handler). Persistent state lives in /data/rauc on
# the shared btrfs data partition, which is NOT overwritten by updates.

[system]
compatible=arasaka-x86_64
bootloader=custom
bundle-formats=verity
data-directory=/data/rauc
# The rootfs is mounted read-only, so RAUC's bundle mount scratch must live on
# the writable btrfs data partition (persist-data mounts /data before rauc).
mountprefix=/data/rauc/mnt

[keyring]
path=/etc/rauc/keyring.pem

[handlers]
system-info=/usr/lib/rauc/system-info.sh
bootloader-custom-backend=/usr/lib/rauc/rauc-boot-handler.sh

[slot.rootfs.0]
device=/dev/disk/by-partlabel/arasaka-slot-a
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/arasaka-slot-b
type=raw
bootname=B
