---
defaultGroups:
    - users
    - lp
    - video
    - render
    - network
    - storage
    - wheel
    - audio

sudoersGroup:    wheel
sudoersConfigureWithGroup: false

setRootPassword: false

displayAutologin:   false
doAutologin:     false

passwordRequirements:
    minLength: 1
    maxLength: -1

user:
  shell: /bin/bash
  forbidden_names: [ root ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${login}-arasaka"
  forbidden_names: [ localhost ]

presets:
    fullName:
        editable: true
    loginName:
        editable: true
