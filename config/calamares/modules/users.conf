---
defaultGroups:
    - users
    - lp
    - video
    - render
    - network
    - storage
    - audio

# No sudo / no wheel on the installed system by design (immutable rootfs,
# Polkit allowlist instead). The post-install hook also strips wheel from any
# pre-existing account and removes /etc/sudoers.d entirely.
sudoersGroup:
sudoersConfigureWithGroup: false

setRootPassword: false

displayAutologin:   false
doAutologin:     false

passwordRequirements:
    minLength: 1
    maxLength: -1

user:
  shell: /bin/bash
  forbidden_names: [ root ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${login}-arasaka"
  forbidden_names: [ localhost ]

presets:
    fullName:
        editable: true
    loginName:
        editable: true
