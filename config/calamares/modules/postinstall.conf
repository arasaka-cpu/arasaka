---
# Runs the Arasaka A/B post-install setup in the live system (not the target
# chroot). ${ROOT} is expanded by Calamares to the target root mount point.
dontChroot: true
timeout: 600
verbose: true

script:
    - command: "/etc/calamares/scripts/arasaka-postinstall.sh ${ROOT}"
      timeout: 600
