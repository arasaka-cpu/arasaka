---
# "local" expands to LIBDIR/calamares/modules (i.e. /usr/lib/calamares/modules).
# Without this, Calamares has no module search path and reports every module
# as "not found in module search paths".
modules-search:
    - local

instances:
  - id:       arasaka-welcome
    module:   welcome
    config:   welcome.conf
  - id:       arasaka-locale
    module:   locale
    config:   locale.conf
  - id:       arasaka-keyboard
    module:   keyboard
    config:   keyboard.conf
  - id:       arasaka-users
    module:   users
    config:   users.conf
  - id:       arasaka-partition
    module:   partition
    config:   partition.conf
  - id:       arasaka-mount
    module:   mount
    config:   mount.conf
  - id:       arasaka-unpackfs
    module:   unpackfs
    config:   unpackfs.conf
  - id:       arasaka-fstab
    module:   fstab
    config:   fstab.conf
  - id:       arasaka-bootloader
    module:   bootloader
    config:   bootloader.conf
  - id:       arasaka-machineid
    module:   machineid
    config:   machineid.conf
  - id:       arasaka-postinstall
    module:   shellprocess
    config:   postinstall.conf
  - id:       arasaka-finished
    module:   finished
    config:   finished.conf

sequence:
  - show:
      - welcome@arasaka-welcome
      - locale@arasaka-locale
      - keyboard@arasaka-keyboard
      - users@arasaka-users
      - partition@arasaka-partition
  - exec:
      - partition@arasaka-partition
      - mount@arasaka-mount
      - unpackfs@arasaka-unpackfs
      - users@arasaka-users
      - fstab@arasaka-fstab
      - bootloader@arasaka-bootloader
      - machineid@arasaka-machineid
      - shellprocess@arasaka-postinstall
  - show:
      - finished@arasaka-finished

branding: arasaka
