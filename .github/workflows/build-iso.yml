# Builds the Arasaka ISO and uploads it to Backblaze B2.
#
# The build scripts require a real Arch Linux environment running as a
# non-root user with sudo, and peak at ~35 GB of disk. This workflow:
#   1. frees space on an ubuntu-latest runner,
#   2. bootstraps an Arch Linux chroot into it,
#   3. runs build.sh + create-iso.sh inside the chroot as an unprivileged
#      builder user (passwordless sudo),
#   4. uploads the resulting .iso to B2, keeping only the newest ones,
#   5. builds the signed RAUC OTA bundle and uploads it (with the signed
#      update pointer) to the updates bucket.
#
# Required repo secrets: B2_APPLICATION_KEY_ID, B2_APPLICATION_KEY, B2_BUCKET
#                        B2_UPDATES_APPLICATION_KEY_ID, B2_UPDATES_APPLICATION_KEY, B2_UPDATES_BUCKET
#                        OTA_SIGNING_KEY, OTA_SIGNING_CERT

name: Build Arasaka ISO

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # weekly Monday 04:17 UTC

permissions:
  contents: write

concurrency:
  group: arasaka-iso
  cancel-in-progress: true

env:
  CHROOT_DIR: /tmp/arch/root.x86_64
  REPO_DIR: /home/builder/arasaka
  DUMMY_SUDO_PW: ci

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show free disk
        run: df -h /

      - name: Bootstrap Arch Linux chroot
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q zstd
          mkdir -p /tmp/arch
          cd /tmp/arch
          echo "Downloading Arch bootstrap tarball..."
          curl -fL --retry 3 -o bootstrap.tar.zst \
            https://geo.mirror.pkgbuild.com/iso/latest/archlinux-bootstrap-x86_64.tar.zst
          sudo tar --zstd -xf bootstrap.tar.zst
          sudo rm bootstrap.tar.zst
          echo "chroot ready at ${CHROOT_DIR}"

      - name: Initialize chroot (keyring, base, tools)
        run: |
          set -euo pipefail
          CH="${CHROOT_DIR}"
          sudo mkdir -p "${CH}"/{proc,sys,dev,run,home/builder}
          sudo mount --bind /proc "${CH}/proc"
          sudo mount --bind /sys  "${CH}/sys"
          sudo mount --bind /dev  "${CH}/dev"
          sudo mount --bind /run  "${CH}/run"
          sudo cp /etc/resolv.conf "${CH}/etc/resolv.conf"
          echo "Server = https://geo.mirror.pkgbuild.com/\$repo/os/\$arch" | \
            sudo tee "${CH}/etc/pacman.d/mirrorlist" >/dev/null
          # Inside a chroot pacman cannot resolve the cachedir's mount point
          # (host overlayfs isn't visible), so its free-space check always
          # fails. Disable CheckSpace - standard workaround for chroot builds.
          sudo sed -i 's/^CheckSpace/#CheckSpace/' "${CH}/etc/pacman.conf"
          sudo chroot "${CH}" /usr/bin/bash -c '
            set -euo pipefail
            mkdir -p /var/cache/pacman/pkg
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Sy --noconfirm
            pacman -S --noconfirm --needed \
              base arch-install-scripts sudo base-devel git rsync curl \
              squashfs-tools dosfstools mtools xorriso parted efibootmgr \
              e2fsprogs btrfs-progs python openssl \
              rauc desync
            useradd -m -s /bin/bash builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
            chmod 440 /etc/sudoers.d/builder
            pacman -Scc --noconfirm || true
          '
          echo "chroot initialized"

      - name: Copy repository into chroot
        run: |
          set -euo pipefail
          CH="${CHROOT_DIR}"
          sudo mkdir -p "${CH}/${REPO_DIR}"
          sudo cp -a "${GITHUB_WORKSPACE}/." "${CH}/${REPO_DIR}/"
          sudo chroot "${CH}" chown -R builder:builder "${REPO_DIR}"
          echo "repo copied to ${CH}/${REPO_DIR}"

      # GE-Proton (~508 MB) is hosted on the GitHub release CDN and mirrored on
      # B2, but BOTH intermittently refuse the runner egress IP (404/403).
      # github.com itself is always reachable from runners (checkout works), so
      # the tarball is committed to the ge-proton-mirror repo as six ~89 MB git
      # chunks and reassembled here - fully deterministic, no external host.
      - name: Checkout GE-Proton mirror
        uses: actions/checkout@v4
        with:
          repository: arasaka-cpu/ge-proton-mirror
          path: ge-proton-mirror

      - name: Assemble GE-Proton from mirror chunks
        run: |
          set -euo pipefail
          mkdir -p /tmp/GE-Proton
          cat "${GITHUB_WORKSPACE}/ge-proton-mirror/chunks/GE-Proton11-3.tar.gz.part-"* \
            > /tmp/GE-Proton/GE-Proton11-3.tar.gz
          cp "${GITHUB_WORKSPACE}/ge-proton-mirror/GE-Proton11-3.sha512sum" \
            /tmp/GE-Proton/GE-Proton11-3.sha512sum
          ( cd /tmp/GE-Proton && sha512sum -c GE-Proton11-3.sha512sum )
          ls -lh /tmp/GE-Proton/

      - name: Copy GE-Proton into chroot
        run: |
          set -euo pipefail
          if [ -s /tmp/GE-Proton/GE-Proton11-3.tar.gz ]; then
            sudo mkdir -p "${CHROOT_DIR}/tmp/GE-Proton"
            sudo cp /tmp/GE-Proton/GE-Proton11-3* "${CHROOT_DIR}/tmp/GE-Proton/"
            sudo chroot "${CHROOT_DIR}" chown -R builder:builder /tmp/GE-Proton
            echo "GE-Proton copied into chroot at /tmp/GE-Proton"
          else
            echo "No staged GE-Proton - build.sh will download."
          fi

      - name: Build rootfs (build.sh)
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -euo pipefail
          sudo chroot "${CHROOT_DIR}" /usr/bin/su - builder -c \
            'cd /home/builder/arasaka && ARASAKA_SUDO_PASSWORD="ci" \
             B2_APPLICATION_KEY_ID="'"${B2_APPLICATION_KEY_ID}"'" \
             B2_APPLICATION_KEY="'"${B2_APPLICATION_KEY}"'" \
             B2_BUCKET="'"${B2_BUCKET}"'" \
             ./build.sh'

      - name: Build ISO (create-iso.sh)
        run: |
          set -euo pipefail
          sudo chroot "${CHROOT_DIR}" /usr/bin/su - builder -c \
            'cd /home/builder/arasaka && ARASAKA_SUDO_PASSWORD="ci" ./create-iso.sh'

      # Build the signed OTA bundle (build-bundle.sh) from the rootfs produced
      # by build.sh: squashfs + dm-verity slot image + regenerated initramfs,
      # wrapped in a verity RAUC bundle signed with the OTA signing key and
      # verified against the staged CA. The signing key/cert are passed via
      # secrets.
      - name: Build OTA bundle (build-bundle.sh)
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
          OTA_SIGNING_CERT: ${{ secrets.OTA_SIGNING_CERT }}
        run: |
          set -euo pipefail
          if [ -z "$OTA_SIGNING_KEY" ] || [ -z "$OTA_SIGNING_CERT" ]; then
            echo "::warning::OTA_SIGNING_KEY / OTA_SIGNING_CERT secrets not set; skipping OTA bundle"
            exit 0
          fi
          CH="${CHROOT_DIR}"
          # Secrets are written to files inside the chroot (never to the repo).
          echo "$OTA_SIGNING_KEY" > /tmp/ota-signing.key
          echo "$OTA_SIGNING_CERT" > /tmp/ota-signing.crt
          sudo mkdir -p "${CH}/tmp/ota"
          sudo cp /tmp/ota-signing.key "${CH}/tmp/ota/signing.key"
          sudo cp /tmp/ota-signing.crt "${CH}/tmp/ota/signing.crt"
          rm -f /tmp/ota-signing.key /tmp/ota-signing.crt
          sudo chroot "${CH}" chmod 600 /tmp/ota/signing.key
          sudo chroot "${CH}" /usr/bin/bash -c \
            'cd /home/builder/arasaka && ARASAKA_SUDO_PASSWORD="ci" \
             OTA_SIGNING_KEY="/tmp/ota/signing.key" \
             OTA_SIGNING_CERT="/tmp/ota/signing.crt" \
             ./build-bundle.sh'

      # Collect bundle-build debug artifacts (make-verity output, system info)
      # out of the chroot so they survive even when the bundle step fails.
      - name: Collect bundle debug artifacts
        if: always()
        run: |
          set -uo pipefail
          DBG="${CHROOT_DIR}/${REPO_DIR}/build/debug"
          if [ -d "$DBG" ]; then
            mkdir -p "${GITHUB_WORKSPACE}/debug"
            sudo cp -a "$DBG/." "${GITHUB_WORKSPACE}/debug/" 2>/dev/null || true
          else
            echo "no debug dir at $DBG (bundle step failed before dump-system-info)"
          fi
          echo "=== debug files ==="
          ls -la "${GITHUB_WORKSPACE}/debug" 2>/dev/null || true
          echo "=== make-verity-output.txt (head) ==="
          sed -n '1,200p' "${GITHUB_WORKSPACE}/debug/make-verity-output.txt" 2>/dev/null || true

      - name: Upload bundle debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arasaka-bundle-debug
          path: debug/
          if-no-files-found: ignore

      - name: Copy ISO out of chroot
        run: |
          set -euo pipefail
          sudo cp "${CHROOT_DIR}/${REPO_DIR}"/build/*.iso "${GITHUB_WORKSPACE}/"
          sudo chown "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"/arasaka-*.iso
          ls -lh "${GITHUB_WORKSPACE}"/arasaka-*.iso

      # Free, uncapped download channel for testing: B2 free tier egress is
      # ~1 GB/day, and one 4.6 GB ISO download exhausts it. Upload the ISO as a
      # build artifact so the maintainer can pull it from GitHub instead.
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: arasaka-iso
          path: arasaka-*.iso
          retention-days: 90
          compression-level: 0

      - name: Copy bundle out of chroot
        run: |
          set -euo pipefail
          BUNDLE=$(sudo cat "${CHROOT_DIR}/${REPO_DIR}/build/bundle-path" 2>/dev/null || true)
          if [ -n "$BUNDLE" ] && [ -f "${CHROOT_DIR}/${BUNDLE}" ]; then
            sudo cp "${CHROOT_DIR}/${BUNDLE}" "${GITHUB_WORKSPACE}/"
            sudo chown "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"/arasaka-*.raucb
            ls -lh "${GITHUB_WORKSPACE}"/arasaka-*.raucb
          else
            echo "No OTA bundle produced (secrets not configured?); skipping bundle publish"
          fi

      # Write update/stable/latest.json + latest.json.sig for the bundle. The
      # pointer is signed with the same OTA signing key the devices trust.
      - name: Write update pointer
        if: always()
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          BUNDLE=$(ls "${GITHUB_WORKSPACE}"/arasaka-*.raucb 2>/dev/null | head -1 || true)
          [ -n "$BUNDLE" ] || { echo "no bundle; skipping pointer"; exit 0; }
          [ -n "$OTA_SIGNING_KEY" ] || { echo "no signing key; skipping pointer"; exit 0; }
          mkdir -p "${GITHUB_WORKSPACE}/pointer"
          python3 - "$BUNDLE" > "${GITHUB_WORKSPACE}/pointer/latest.json" <<'PY'
          import hashlib, json, os, sys
          bundle = sys.argv[1]
          name = os.path.basename(bundle)
          sha = hashlib.sha256()
          with open(bundle, "rb") as f:
              for chunk in iter(lambda: f.read(1 << 20), b""):
                  sha.update(chunk)
          print(json.dumps({
              "version": name[len("arasaka-"):-len(".raucb")],
              "bundle": name,
              "sha256": sha.hexdigest(),
              "size": os.path.getsize(bundle),
          }, separators=(",", ":")))
          PY
          echo "$OTA_SIGNING_KEY" > /tmp/ota-pointer.key
          openssl dgst -sha256 -sign /tmp/ota-pointer.key \
            -out "${GITHUB_WORKSPACE}/pointer/latest.json.sig" \
            "${GITHUB_WORKSPACE}/pointer/latest.json"
          rm -f /tmp/ota-pointer.key
          # Verify the pointer with the staged public key before publishing.
          openssl x509 -in "${GITHUB_WORKSPACE}/config/rauc/signing.crt" -pubkey -noout 2>/dev/null \
            | openssl dgst -sha256 -verify /dev/stdin \
            -signature "${GITHUB_WORKSPACE}/pointer/latest.json.sig" \
            "${GITHUB_WORKSPACE}/pointer/latest.json" \
            || echo "::warning::pointer self-check failed"
          cat "${GITHUB_WORKSPACE}/pointer/latest.json"

      # Publish a rolling GitHub Release with the ISO, OTA bundle and the
      # signed update pointer. Release assets are served from GitHub's object
      # CDN (no artifact re-zip), so this gives devices a fast secondary
      # source when B2's free egress cap is hit: arasaka-ota-update falls back
      # to it via GH_OWNER_REPO/GH_RELEASE_TAG/SOURCE_ORDER in ota.conf.
      - name: Publish rolling GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE="rolling"
          ASSETS=()
          ISO=$(ls "${GITHUB_WORKSPACE}"/arasaka-*.iso 2>/dev/null | head -1 || true)
          [ -n "$ISO" ] && ASSETS+=("$ISO")
          BUNDLE=$(ls "${GITHUB_WORKSPACE}"/arasaka-*.raucb 2>/dev/null | head -1 || true)
          [ -n "$BUNDLE" ] && ASSETS+=("$BUNDLE")
          for f in "${GITHUB_WORKSPACE}"/pointer/latest.json "${GITHUB_WORKSPACE}"/pointer/latest.json.sig; do
            [ -f "$f" ] && ASSETS+=("$f")
          done
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "no assets produced; skipping release publish"
            exit 0
          fi
          # Create the rolling release on first build; reuse it afterwards.
          # --latest=false keeps tagged stable releases on the "latest" slot.
          if ! gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release create "$RELEASE" \
              --target "$GITHUB_SHA" \
              --title "Arasaka rolling build" \
              --notes "Rolling build from ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}. ISO + OTA bundle + signed update pointer." \
              --latest=false
          fi
          # Upload new assets first (--clobber replaces same-name assets),
          # then prune stale ones (old dated ISO/bundle filenames) so the
          # release always mirrors exactly this build.
          for a in "${ASSETS[@]}"; do
            gh release upload "$RELEASE" "$a" --clobber 2>/dev/null || gh release upload "$RELEASE" "$a"
          done
          TMPLIST=$(mktemp)
          for a in "${ASSETS[@]}"; do basename "$a"; done | sort > "$TMPLIST"
          gh release view "$RELEASE" --json assets -q '.assets[].name' 2>/dev/null | while read -r n; do
            if [ -n "$n" ] && ! grep -qx "$n" "$TMPLIST"; then
              echo "removing stale asset $n"
              gh release delete-asset "$RELEASE" "$n" --yes || true
            fi
          done
          rm -f "$TMPLIST"
          echo "::notice::rolling release updated: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE}"

      # rclone's copy() does a HEAD check via the B2 *download* host, which
      # intermittently 403s from runner egress IPs (Unknown 403) and aborts the
      # upload before it starts. The native B2 API (authorize -> get_upload_url
      # -> upload) uses the api + upload hosts only, never the download host,
      # so it is not subject to that block.
      - name: Upload ISO to Backblaze B2
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "$B2_APPLICATION_KEY_ID" ] || [ -z "$B2_APPLICATION_KEY" ] || [ -z "$B2_BUCKET" ]; then
            echo "::error::B2 secrets not configured. Add B2_APPLICATION_KEY_ID, B2_APPLICATION_KEY, B2_BUCKET."
            exit 1
          fi
          NEW=$(ls "${GITHUB_WORKSPACE}"/arasaka-*.iso | head -1)
          echo "Uploading ${NEW} to B2 bucket ${B2_BUCKET} via native API"
          python3 - "$NEW" <<'PY'
          import hashlib, json, os, subprocess, sys, time
          
          ISO = sys.argv[1]
          KEY_ID = os.environ["B2_APPLICATION_KEY_ID"]
          KEY = os.environ["B2_APPLICATION_KEY"]
          BUCKET = os.environ["B2_BUCKET"]
          
          def curl_json(args, data=None, body=None):
              cmd = ["curl", "-sS"] + args + ["-w", "\n%{http_code}"]
              if data is not None:
                  cmd += ["--data-binary", data]
              r = subprocess.run(cmd, input=body, capture_output=True)
              out = r.stdout.decode(errors="replace")
              code = out.rsplit("\n", 1)[-1].strip() if out else ""
              if r.returncode != 0 or not code.startswith("2"):
                  print("curl request failed:", r.stderr.decode(errors="replace"),
                        "http", code, "body:", out[:600], file=sys.stderr)
                  raise subprocess.CalledProcessError(
                      r.returncode if r.returncode else int(code), r.args,
                      (r.stderr + r.stdout)[:800])
              return json.loads(out.rsplit("\n", 1)[0])
          
          def retry(fn, n=4, delay=5):
              for i in range(n):
                  try:
                      return fn()
                  except (subprocess.CalledProcessError, json.JSONDecodeError,
                          OSError, http.client.HTTPException):
                      if i == n - 1:
                          raise
                      time.sleep(delay)
          
          auth = retry(lambda: curl_json(["-u", f"{KEY_ID}:{KEY}",
              "https://api.backblazeb2.com/b2api/v3/b2_authorize_account"]))
          token = auth["authorizationToken"]
          auth_info = auth.get("apiInfo") or {}
          api_url = (auth.get("apiUrl") or auth_info.get("apiUrl")
              or (auth_info.get("storageApi") or {}).get("apiUrl"))
          if not api_url:
              raise SystemExit("cannot find apiUrl in authorize response: "
                               + json.dumps(auth)[:400])
          print(f"authorized: api={api_url}")
          
          # Bucket-restricted app keys get 401 from list_buckets unless the
          # request names the bucket (see b2_list_buckets docs).
          buckets = retry(lambda: curl_json(["-H", f"Authorization: {token}",
              f"{api_url}/b2api/v3/b2_list_buckets",
              "--data-binary", json.dumps({"accountId": auth.get("accountId", ""),
                                           "bucketName": BUCKET})]))
          bucket_id = next(b["bucketId"] for b in buckets["buckets"] if b["bucketName"] == BUCKET)
          print(f"bucket {BUCKET} id {bucket_id}")
          
          file_name = os.path.basename(ISO)

          # Get upload URL
          up = curl_json(["-H", f"Authorization: {token}",
              f"{api_url}/b2api/v3/b2_get_upload_url",
              "--data-binary", json.dumps({"bucketId": bucket_id})])
          up_token = (up.get("uploadAuthorizationToken") or up.get("authorizationToken"))
          if not up_token:
              raise SystemExit("no token in get_upload_url response: " + json.dumps(up)[:400])

          # Compute the SHA-1 by streaming over the file (constant memory).
          sha1 = hashlib.sha1()
          with open(ISO, "rb") as src:
              for chunk in iter(lambda: src.read(1 << 20), b""):
                  sha1.update(chunk)

          # Keep only one ISO in the bucket: the free-tier storage cap makes a
          # second 5 GB ISO push the bucket over the limit (old + new + the
          # GE-Proton assets), so any existing arasaka-*.iso MUST be deleted
          # BEFORE the new ISO is uploaded. A failed upload therefore leaves no
          # ISO behind — a fresh run will simply upload the new one.
          existing = retry(lambda: curl_json(["-H", f"Authorization: {token}",
              f"{api_url}/b2api/v3/b2_list_file_names",
              "--data-binary", json.dumps({"bucketId": bucket_id,
                                           "prefix": "arasaka-",
                                           "maxFileCount": 1000})]))
          for f in existing.get("files", []):
              print(f"removing old ISO {f['fileName']} ({f['fileId']})")
              curl_json(["-H", f"Authorization: {token}",
                  f"{api_url}/b2api/v3/b2_delete_file_version",
                  "--data-binary", json.dumps({"fileName": f["fileName"],
                                               "fileId": f["fileId"]})])

          # Upload with http.client, which streams the file body in 8 KiB
          # blocks instead of buffering it (curl --data-binary spools the whole
          # ISO to memory and OOMs on the 5 GB file).
          import http.client, urllib.parse
          u = urllib.parse.urlsplit(up["uploadUrl"])

          def do_upload():
              conn = http.client.HTTPSConnection(u.hostname, timeout=3600)
              headers = {
                  "Authorization": up_token,
                  "X-Bz-File-Name": urllib.parse.quote(file_name, safe=""),
                  "X-Bz-Content-Sha1": sha1.hexdigest(),
                  "Content-Type": "application/octet-stream",
                  "Content-Length": str(os.path.getsize(ISO)),
              }
              with open(ISO, "rb") as src:
                  conn.request("POST", u.path, body=src, headers=headers)
              resp = conn.getresponse()
              body = resp.read()
              conn.close()
              if resp.status != 200:
                  raise subprocess.CalledProcessError(
                      resp.status, "b2_upload_file",
                      body.decode(errors="replace")[:600])
              return json.loads(body)

          result = retry(do_upload)
          print(f"uploaded {file_name} ({result.get('contentLength')} bytes) fileId {result['fileId']}")
          
          # Safety net: ensure only the newest ISO remains (should already be
          # the case since we delete old ISOs before upload).
          listing = retry(lambda: curl_json(["-H", f"Authorization: {token}",
              f"{api_url}/b2api/v3/b2_list_file_names",
              "--data-binary", json.dumps({"bucketId": bucket_id, "prefix": "arasaka-",
                                           "maxFileCount": 1000})]))
          files = sorted(listing["files"], key=lambda f: f.get("uploadTimestamp", 0), reverse=True)
          for f in files[1:]:
              print(f"removing old ISO {f['fileName']}")
              curl_json(["-H", f"Authorization: {token}",
                  f"{api_url}/b2api/v3/b2_delete_file_version",
                  "--data-binary", json.dumps({"fileName": f["fileName"], "fileId": f["fileId"]})])
          print(f"::notice::ISO uploaded to Backblaze B2 bucket {BUCKET}")
          PY

      # Upload the signed OTA bundle and update pointer to the updates bucket
      # (B2_UPDATES_BUCKET, e.g. arasaka-updates). The bundle is uploaded
      # first and the signed latest.json pointer LAST, so devices can never
      # resolve a pointer to a half-uploaded bundle.
      - name: Upload OTA bundle + pointer to Backblaze B2
        if: always()
        env:
          B2_UPDATES_APPLICATION_KEY_ID: ${{ secrets.B2_UPDATES_APPLICATION_KEY_ID }}
          B2_UPDATES_APPLICATION_KEY: ${{ secrets.B2_UPDATES_APPLICATION_KEY }}
          B2_UPDATES_BUCKET: ${{ secrets.B2_UPDATES_BUCKET }}
        run: |
          set -euo pipefail
          BUNDLE=$(ls "${GITHUB_WORKSPACE}"/arasaka-*.raucb 2>/dev/null | head -1 || true)
          POINTER=$(ls "${GITHUB_WORKSPACE}"/pointer/latest.json 2>/dev/null || true)
          [ -n "$BUNDLE" ] && [ -n "$POINTER" ] || { echo "no bundle/pointer; skipping OTA upload"; exit 0; }
          if [ -z "$B2_UPDATES_APPLICATION_KEY_ID" ] || [ -z "$B2_UPDATES_APPLICATION_KEY" ] || [ -z "$B2_UPDATES_BUCKET" ]; then
            echo "::error::B2_UPDATES secrets not configured. Add B2_UPDATES_APPLICATION_KEY_ID, B2_UPDATES_APPLICATION_KEY, B2_UPDATES_BUCKET."
            exit 1
          fi
          python3 - "$BUNDLE" "$POINTER" <<'PY'
          import hashlib, json, os, subprocess, sys, time, urllib.parse

          BUNDLE, POINTER = sys.argv[1], sys.argv[2]
          KEY_ID = os.environ["B2_UPDATES_APPLICATION_KEY_ID"]
          KEY = os.environ["B2_UPDATES_APPLICATION_KEY"]
          BUCKET = os.environ["B2_UPDATES_BUCKET"]
          PREFIX = "update/stable/"

          def curl_json(args, data=None, body=None):
              cmd = ["curl", "-sS"] + args + ["-w", "\n%{http_code}"]
              if data is not None:
                  cmd += ["--data-binary", data]
              r = subprocess.run(cmd, input=body, capture_output=True)
              out = r.stdout.decode(errors="replace")
              code = out.rsplit("\n", 1)[-1].strip() if out else ""
              if r.returncode != 0 or not code.startswith("2"):
                  print("curl request failed:", r.stderr.decode(errors="replace"),
                        "http", code, "body:", out[:600], file=sys.stderr)
                  raise subprocess.CalledProcessError(
                      r.returncode if r.returncode else int(code), r.args,
                      (r.stderr + r.stdout)[:800])
              return json.loads(out.rsplit("\n", 1)[0])

          def retry(fn, n=4, delay=5):
              for i in range(n):
                  try:
                      return fn()
                  except (subprocess.CalledProcessError, json.JSONDecodeError,
                          OSError, http.client.HTTPException):
                      if i == n - 1:
                          raise
                      time.sleep(delay)

          auth = retry(lambda: curl_json(["-u", f"{KEY_ID}:{KEY}",
              "https://api.backblazeb2.com/b2api/v3/b2_authorize_account"]))
          token = auth["authorizationToken"]
          auth_info = auth.get("apiInfo") or {}
          api_url = (auth.get("apiUrl") or auth_info.get("apiUrl")
              or (auth_info.get("storageApi") or {}).get("apiUrl"))
          if not api_url:
              raise SystemExit("cannot find apiUrl: " + json.dumps(auth)[:400])
          print(f"authorized: api={api_url}")

          # Bucket-restricted app keys get 401/404 from b2_get_bucket_by_name
          # (it does not work for restricted keys in practice). Resolve the
          # bucket with b2_list_buckets filtered by bucketName instead — the
          # same method used by the ISO upload above, which the restricted key
          # is authorized to perform.
          buckets = retry(lambda: curl_json(["-H", f"Authorization: {token}",
              f"{api_url}/b2api/v3/b2_list_buckets",
              "--data-binary", json.dumps({"accountId": auth.get("accountId", ""),
                                           "bucketName": BUCKET})]))
          bucket_id = next(b["bucketId"] for b in buckets["buckets"] if b["bucketName"] == BUCKET)
          print(f"bucket {BUCKET} id {bucket_id}")

          up = curl_json(["-H", f"Authorization: {token}",
              f"{api_url}/b2api/v3/b2_get_upload_url",
              "--data-binary", json.dumps({"bucketId": bucket_id})])
          up_token = up.get("uploadAuthorizationToken") or up.get("authorizationToken")
          if not up_token:
              raise SystemExit("no token in get_upload_url: " + json.dumps(up)[:400])

          def sha1_of(path):
              h = hashlib.sha1()
              with open(path, "rb") as src:
                  for chunk in iter(lambda: src.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          import http.client, urllib.parse
          u = urllib.parse.urlsplit(up["uploadUrl"])

          def upload_file(local_path, b2_name):
              with open(local_path, "rb") as src:
                  size = os.path.getsize(local_path)
                  conn = http.client.HTTPSConnection(u.hostname, timeout=3600)
                  headers = {
                      "Authorization": up_token,
                      "X-Bz-File-Name": urllib.parse.quote(b2_name, safe=""),
                      "X-Bz-Content-Sha1": sha1_of(local_path),
                      "Content-Type": "application/octet-stream",
                      "Content-Length": str(size),
                  }
                  conn.request("POST", u.path, body=src, headers=headers)
                  resp = conn.getresponse()
                  body = resp.read()
                  conn.close()
                  if resp.status != 200:
                      raise subprocess.CalledProcessError(
                          resp.status, "b2_upload_file", body.decode(errors="replace")[:600])
                  print(f"uploaded {b2_name} ({size} bytes)")
                  return json.loads(body)

          def replace_existing(b2_name):
              existing = retry(lambda: curl_json(["-H", f"Authorization: {token}",
                  f"{api_url}/b2api/v3/b2_list_file_names",
                  "--data-binary", json.dumps({"bucketId": bucket_id, "prefix": b2_name})]))
              for f in existing.get("files", []):
                  print(f"replacing existing {f['fileName']}")
                  curl_json(["-H", f"Authorization: {token}",
                      f"{api_url}/b2api/v3/b2_delete_file_version",
                      "--data-binary", json.dumps({"fileName": f["fileName"], "fileId": f["fileId"]})])

          bundle_name = PREFIX + os.path.basename(BUNDLE)
          print("uploading bundle first, pointer last")
          replace_existing(bundle_name)
          retry(lambda: upload_file(BUNDLE, bundle_name))

          # Keep only the newest OTA bundle. Bundle names are versioned, so
          # they would otherwise accumulate in the bucket forever; the pointer
          # only ever references the newest one, and old bundles are dead
          # weight. Never delete the just-uploaded bundle.
          listing = retry(lambda: curl_json(["-H", f"Authorization: {token}",
              f"{api_url}/b2api/v3/b2_list_file_names",
              "--data-binary", json.dumps({"bucketId": bucket_id, "prefix": PREFIX,
                                           "maxFileCount": 1000})]))
          bundles = [f for f in listing["files"] if f["fileName"].endswith(".raucb")]
          for f in sorted(bundles, key=lambda f: f.get("uploadTimestamp", 0), reverse=True)[1:]:
              print(f"removing old OTA bundle {f['fileName']}")
              curl_json(["-H", f"Authorization: {token}",
                  f"{api_url}/b2api/v3/b2_delete_file_version",
                  "--data-binary", json.dumps({"fileName": f["fileName"], "fileId": f["fileId"]})])

          for f in ("latest.json", "latest.json.sig"):
              b2_name = PREFIX + f
              replace_existing(b2_name)
              retry(lambda: upload_file(os.path.join(os.path.dirname(POINTER), f), b2_name))
          print(f"::notice::OTA bundle + pointer uploaded to B2 bucket {BUCKET} under {PREFIX}")
          PY

      - name: Generate shareable download link
        if: always()
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -euo pipefail
          FILE=$(ls "${GITHUB_WORKSPACE}"/arasaka-*.iso 2>/dev/null | head -1 || true)
          [ -n "$FILE" ] || { echo "no iso to link"; exit 0; }
          FILE=${FILE##*/}
          python3 -m pip install --user -q --break-system-packages b2 2>/dev/null || true
          export PATH="$HOME/.local/bin:$PATH"
          B2_APPLICATION_KEY_ID="$B2_APPLICATION_KEY_ID" \
          B2_APPLICATION_KEY="$B2_APPLICATION_KEY" \
            b2 get-download-url-with-auth "$B2_BUCKET" "$FILE" --duration 604800 \
          | sed 's/^/Download link (7 days): /' || \
            echo "Could not generate signed URL (file is in bucket as $FILE)"
