# Builds the Arasaka ISO and uploads it to Backblaze B2.
#
# The build scripts require a real Arch Linux environment running as a
# non-root user with sudo, and peak at ~35 GB of disk. This workflow:
#   1. frees space on an ubuntu-latest runner,
#   2. bootstraps an Arch Linux chroot into it,
#   3. runs build.sh + create-iso.sh inside the chroot as an unprivileged
#      builder user (passwordless sudo),
#   4. uploads the resulting .iso to B2, keeping only the newest ones.
#
# Required repo secrets: B2_APPLICATION_KEY_ID, B2_APPLICATION_KEY, B2_BUCKET

name: Build Arasaka ISO

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # weekly Monday 04:17 UTC

permissions:
  contents: read

concurrency:
  group: arasaka-iso
  cancel-in-progress: true

env:
  CHROOT_DIR: /tmp/arch/root.x86_64
  REPO_DIR: /home/builder/arasaka
  DUMMY_SUDO_PW: ci

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show free disk
        run: df -h /

      - name: Bootstrap Arch Linux chroot
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q zstd
          mkdir -p /tmp/arch
          cd /tmp/arch
          echo "Downloading Arch bootstrap tarball..."
          curl -fL --retry 3 -o bootstrap.tar.zst \
            https://geo.mirror.pkgbuild.com/iso/latest/archlinux-bootstrap-x86_64.tar.zst
          sudo tar --zstd -xf bootstrap.tar.zst
          sudo rm bootstrap.tar.zst
          echo "chroot ready at ${CHROOT_DIR}"

      - name: Initialize chroot (keyring, base, tools)
        run: |
          set -euo pipefail
          CH="${CHROOT_DIR}"
          sudo mkdir -p "${CH}"/{proc,sys,dev,run,home/builder}
          sudo mount --bind /proc "${CH}/proc"
          sudo mount --bind /sys  "${CH}/sys"
          sudo mount --bind /dev  "${CH}/dev"
          sudo mount --bind /run  "${CH}/run"
          sudo cp /etc/resolv.conf "${CH}/etc/resolv.conf"
          echo "Server = https://geo.mirror.pkgbuild.com/\$repo/os/\$arch" | \
            sudo tee "${CH}/etc/pacman.d/mirrorlist" >/dev/null
          # Inside a chroot pacman cannot resolve the cachedir's mount point
          # (host overlayfs isn't visible), so its free-space check always
          # fails. Disable CheckSpace - standard workaround for chroot builds.
          sudo sed -i 's/^CheckSpace/#CheckSpace/' "${CH}/etc/pacman.conf"
          sudo chroot "${CH}" /usr/bin/bash -c '
            set -euo pipefail
            mkdir -p /var/cache/pacman/pkg
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Sy --noconfirm
            pacman -S --noconfirm --needed \
              base arch-install-scripts sudo base-devel git rsync curl \
              squashfs-tools dosfstools mtools xorriso parted efibootmgr \
              e2fsprogs btrfs-progs
            useradd -m -s /bin/bash builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
            chmod 440 /etc/sudoers.d/builder
            pacman -Scc --noconfirm || true
          '
          echo "chroot initialized"

      - name: Copy repository into chroot
        run: |
          set -euo pipefail
          CH="${CHROOT_DIR}"
          sudo mkdir -p "${CH}/${REPO_DIR}"
          sudo cp -a "${GITHUB_WORKSPACE}/." "${CH}/${REPO_DIR}/"
          sudo chroot "${CH}" chown -R builder:builder "${REPO_DIR}"
          echo "repo copied to ${CH}/${REPO_DIR}"

      # GE-Proton (~508 MB) is hosted on the GitHub release CDN and mirrored on
      # B2, but BOTH intermittently refuse the runner egress IP (404/403).
      # github.com itself is always reachable from runners (checkout works), so
      # the tarball is committed to the ge-proton-mirror repo as six ~89 MB git
      # chunks and reassembled here - fully deterministic, no external host.
      - name: Checkout GE-Proton mirror
        uses: actions/checkout@v4
        with:
          repository: arasaka-cpu/ge-proton-mirror
          path: ge-proton-mirror

      - name: Assemble GE-Proton from mirror chunks
        run: |
          set -euo pipefail
          mkdir -p /tmp/GE-Proton
          cat "${GITHUB_WORKSPACE}/ge-proton-mirror/chunks/GE-Proton11-3.tar.gz.part-"* \
            > /tmp/GE-Proton/GE-Proton11-3.tar.gz
          cp "${GITHUB_WORKSPACE}/ge-proton-mirror/GE-Proton11-3.sha512sum" \
            /tmp/GE-Proton/GE-Proton11-3.sha512sum
          ( cd /tmp/GE-Proton && sha512sum -c GE-Proton11-3.sha512sum )
          ls -lh /tmp/GE-Proton/

      - name: Copy GE-Proton into chroot
        run: |
          set -euo pipefail
          if [ -s /tmp/GE-Proton/GE-Proton11-3.tar.gz ]; then
            sudo mkdir -p "${CHROOT_DIR}/tmp/GE-Proton"
            sudo cp /tmp/GE-Proton/GE-Proton11-3* "${CHROOT_DIR}/tmp/GE-Proton/"
            sudo chroot "${CHROOT_DIR}" chown -R builder:builder /tmp/GE-Proton
            echo "GE-Proton copied into chroot at /tmp/GE-Proton"
          else
            echo "No staged GE-Proton - build.sh will download."
          fi

      - name: Build rootfs (build.sh)
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -euo pipefail
          sudo chroot "${CHROOT_DIR}" /usr/bin/su - builder -c \
            'cd /home/builder/arasaka && ARASAKA_SUDO_PASSWORD="ci" \
             B2_APPLICATION_KEY_ID="'"${B2_APPLICATION_KEY_ID}"'" \
             B2_APPLICATION_KEY="'"${B2_APPLICATION_KEY}"'" \
             B2_BUCKET="'"${B2_BUCKET}"'" \
             ./build.sh'

      - name: Build ISO (create-iso.sh)
        run: |
          set -euo pipefail
          sudo chroot "${CHROOT_DIR}" /usr/bin/su - builder -c \
            'cd /home/builder/arasaka && ARASAKA_SUDO_PASSWORD="ci" ./create-iso.sh'

      - name: Copy ISO out of chroot
        run: |
          set -euo pipefail
          sudo cp "${CHROOT_DIR}/${REPO_DIR}"/build/*.iso "${GITHUB_WORKSPACE}/" 
          sudo chown "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"/arasaka-*.iso
          ls -lh "${GITHUB_WORKSPACE}"/arasaka-*.iso

      # rclone's copy() does a HEAD check via the B2 *download* host, which
      # intermittently 403s from runner egress IPs (Unknown 403) and aborts the
      # upload before it starts. The native B2 API (authorize -> get_upload_url
      # -> upload) uses the api + upload hosts only, never the download host,
      # so it is not subject to that block.
      - name: Upload ISO to Backblaze B2
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "$B2_APPLICATION_KEY_ID" ] || [ -z "$B2_APPLICATION_KEY" ] || [ -z "$B2_BUCKET" ]; then
            echo "::error::B2 secrets not configured. Add B2_APPLICATION_KEY_ID, B2_APPLICATION_KEY, B2_BUCKET."
            exit 1
          fi
          NEW=$(ls "${GITHUB_WORKSPACE}"/arasaka-*.iso | head -1)
          echo "Uploading ${NEW} to B2 bucket ${B2_BUCKET} via native API"
          python3 - "$NEW" <<'PY'
          import hashlib, json, os, subprocess, sys, time
          
          ISO = sys.argv[1]
          KEY_ID = os.environ["B2_APPLICATION_KEY_ID"]
          KEY = os.environ["B2_APPLICATION_KEY"]
          BUCKET = os.environ["B2_BUCKET"]
          
          def curl_json(args, data=None, body=None):
              cmd = ["curl", "-fsS"] + args
              if data is not None:
                  cmd += ["--data-binary", data]
              r = subprocess.run(cmd, input=body, capture_output=True)
              if r.returncode != 0:
                  raise subprocess.CalledProcessError(r.returncode, r.args, r.stderr[:500])
              return json.loads(r.stdout.decode())
          
          def retry(fn, n=4, delay=5):
              for i in range(n):
                  try:
                      return fn()
                  except (subprocess.CalledProcessError, json.JSONDecodeError):
                      if i == n - 1:
                          raise
                      time.sleep(delay)
          
          auth = retry(lambda: curl_json(["-u", f"{KEY_ID}:{KEY}",
              "https://api.backblazeb2.com/b2api/v3/b2_authorize_account"]))
          token = auth["authorizationToken"]
          auth_info = auth.get("apiInfo") or {}
          api_url = (auth.get("apiUrl") or auth_info.get("apiUrl")
              or (auth_info.get("storageApi") or {}).get("apiUrl"))
          if not api_url:
              raise SystemExit("cannot find apiUrl in authorize response: "
                               + json.dumps(auth)[:400])
          print(f"authorized: api={api_url}")
          
          buckets = retry(lambda: curl_json(["-H", f"Authorization: {token}",
              f"{api_url}/b2api/v3/b2_list_buckets", "--data-binary", "{}"]))
          bucket_id = next(b["bucketId"] for b in buckets["buckets"] if b["bucketName"] == BUCKET)
          print(f"bucket {BUCKET} id {bucket_id}")
          
          file_name = os.path.basename(ISO)
          sha1 = hashlib.sha1(open(ISO, "rb").read()).hexdigest()
          
          def upload():
              up = curl_json(["-H", f"Authorization: {token}",
                  f"{api_url}/b2api/v3/b2_get_upload_url",
                  "--data-binary", json.dumps({"bucketId": bucket_id})])
              up_token = (up.get("uploadAuthorizationToken") or up.get("authorizationToken"))
              if not up_token:
                  raise SystemExit("no token in get_upload_url response: " + json.dumps(up)[:400])
              return curl_json(["-H", f"Authorization: {up_token}",
                  "-H", f"X-Bz-File-Name: {file_name}",
                  "-H", f"X-Bz-Content-Sha1: {sha1}",
                  "-H", "Content-Type: application/octet-stream",
                  "--data-binary", "@-", up["uploadUrl"]],
                  body=open(ISO, "rb").read())
          
          result = retry(upload)
          print(f"uploaded {file_name} ({result.get('contentLength')} bytes) fileId {result['fileId']}")
          
          listing = retry(lambda: curl_json(["-H", f"Authorization: {token}",
              f"{api_url}/b2api/v3/b2_list_file_names",
              "--data-binary", json.dumps({"bucketId": bucket_id, "prefix": "arasaka-",
                                           "maxFileCount": 1000})]))
          files = sorted(listing["files"], key=lambda f: f.get("uploadTimestamp", 0), reverse=True)
          for f in files[2:]:
              print(f"removing old ISO {f['fileName']}")
              curl_json(["-H", f"Authorization: {token}",
                  f"{api_url}/b2api/v3/b2_delete_file_version",
                  "--data-binary", json.dumps({"fileName": f["fileName"], "fileId": f["fileId"]})])
          print(f"::notice::ISO uploaded to Backblaze B2 bucket {B2_BUCKET}")
          PY

      - name: Generate shareable download link
        if: always()
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -euo pipefail
          FILE=$(ls "${GITHUB_WORKSPACE}"/arasaka-*.iso 2>/dev/null | head -1 | xargs basename)
          [ -n "$FILE" ] || { echo "no iso to link"; exit 0; }
          python3 -m pip install --user -q --break-system-packages b2 2>/dev/null || true
          export PATH="$HOME/.local/bin:$PATH"
          B2_APPLICATION_KEY_ID="$B2_APPLICATION_KEY_ID" \
          B2_APPLICATION_KEY="$B2_APPLICATION_KEY" \
            b2 get-download-url-with-auth "$B2_BUCKET" "$FILE" --duration 604800 \
          | sed 's/^/Download link (7 days): /' || \
            echo "Could not generate signed URL (file is in bucket as $FILE)"
