# Seeds the Actions cache with the GE-Proton tarball. The GitHub release CDN
# and the B2 download endpoint both intermittently refuse runner egress IPs,
# so a fast, build-less run is the cheap way to find a runner that can
# download once. That one successful download is cached under
# ge-proton-v1-GE-Proton11-3-ok and then every real build restores it from
# GitHub's own cache service (always reachable from runners).

name: Seed GE-Proton cache

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GE_VER: GE-Proton11-3

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Restore GE-Proton cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/GE-Proton
          key: ge-proton-v1-GE-Proton11-3-ok

      - name: Fetch GE-Proton if not cached (best effort)
        id: fetch
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -uo pipefail
          GE_URL="https://github.com/GloriousEggroll/proton-ge-custom/releases/download/${GE_VER}/${GE_VER}.tar.gz"
          DIR=/tmp/GE-Proton
          mkdir -p "$DIR"
          echo "downloaded=no" >> "$GITHUB_OUTPUT"
          if [ -s "$DIR/${GE_VER}.tar.gz" ] && ( cd "$DIR" && sha512sum -c "${GE_VER}.sha512sum" ); then
            echo "GE-Proton present in cache - nothing to do."
          else
            echo "Cache miss - downloading GE-Proton..."
            fetch() { curl -fL --retry-all-errors --retry 5 --retry-delay 3 "$@"; }
            if fetch -o "$DIR/${GE_VER}.tar.gz" "$GE_URL" \
                && fetch -o "$DIR/${GE_VER}.sha512sum" "${GE_URL}.sha512sum"; then
              echo "Downloaded from GitHub."
            else
              echo "GitHub download failed - trying Backblaze B2 mirror (bucket: ${B2_BUCKET:-unset})..."
              rm -f "$DIR/${GE_VER}.tar.gz" "$DIR/${GE_VER}.sha512sum"
              AUTH=$(curl -fsS -u "${B2_APPLICATION_KEY_ID:-}:${B2_APPLICATION_KEY:-}" \
                "https://api.backblazeb2.com/b2api/v3/b2_authorize_account" 2>&1) || AUTH=""
              TOKEN=$(echo "$AUTH" | sed -n 's/.*"authorizationToken"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
              DLURL=$(echo "$AUTH" | sed -n 's/.*"downloadUrl"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
              [ -n "$TOKEN" ] && [ -n "$DLURL" ] && {
                fetch -H "Authorization: $TOKEN" -o "$DIR/${GE_VER}.sha512sum" \
                  "$DLURL/file/${B2_BUCKET:-}/proton-ge/${GE_VER}.sha512sum" || true
                fetch -H "Authorization: $TOKEN" -o "$DIR/${GE_VER}.tar.gz" \
                  "$DLURL/file/${B2_BUCKET:-}/proton-ge/${GE_VER}.tar.gz" || true
              }
            fi
            if [ -s "$DIR/${GE_VER}.tar.gz" ] && ( cd "$DIR" && sha512sum -c "${GE_VER}.sha512sum" ); then
              echo "GE-Proton staged OK - saving to cache."
              echo "downloaded=ok" >> "$GITHUB_OUTPUT"
            else
              rm -f "$DIR/${GE_VER}.tar.gz" "$DIR/${GE_VER}.sha512sum"
              echo "::error::Could not stage GE-Proton (GitHub + B2 refused). Trigger again for a fresh runner IP."
            fi
          fi

      - name: Save GE-Proton cache
        if: steps.fetch.outputs.downloaded == 'ok'
        uses: actions/cache/save@v4
        with:
          path: /tmp/GE-Proton
          key: ge-proton-v1-GE-Proton11-3-ok
